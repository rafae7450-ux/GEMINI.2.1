<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMINI 2.1</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;margin:0;padding:10px}
h1{color:#00e5ff;text-align:center}
#chat{background:#111;border:2px solid #00e5ff;border-radius:15px;padding:15px;height:400px;overflow-y:auto;margin-bottom:10px}
.you{color:#00e5ff;margin:10px 0}
.ai{color:white;margin:10px 0;background:#222;padding:10px;border-radius:10px}
#box{display:flex;gap:5px}
input{flex:1;padding:12px;border-radius:10px;border:none;font-size:16px}
button{padding:12px 15px;border:none;border-radius:10px;background:#00e5ff;font-size:18px;cursor:pointer}
#mic{background:#ff4081}
</style>
</head>
<body>
<h1>GEMINI 2.1 🚀</h1>
<div id="chat">
<div class="ai">Welcome to GEMINI 2.1 😊<br>Ask me anything! I can speak in any language you want.</div>
</div>
<div id="box">
<input id="input" placeholder="Type here... hi">
<button id="mic" onclick="startVoice()">🎤</button>
<button onclick="send()">Send ➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');

function addMsg(text, who){
  let d = document.createElement('div');
  d.className = who;
  d.innerText = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function getReply(msg){
  msg = msg.toLowerCase().trim();
  if(msg === 'hi' || msg === 'hello' || msg === 'hey' || msg === 'salam' || msg === 'assalamualaikum'){
    return "Hi! Hello! 😊 How are you? What can I do for you today?";
  }
  if(msg === 'how are you'){
    return "I'm good! Thanks for asking! How are you?";
  }
  if(msg === 'bye'){
    return "Bye bye! See you soon! 👋";
  }
  if(msg.includes('who are you')){
    return "I am GEMINI 2.1, built by Abad Rafae! Ask me anything.";
  }
  if(msg.includes('your name')){
    return "My name is GEMINI 2.1!";
  }
  // For other questions, give short answer
  return "Great question! " + msg + " - Tell me more about what you want to know and I will help you in short and simple words.";
}

function send(){
  let text = input.value.trim();
  if(!text) return;
  addMsg("You: " + text, 'you');
  input.value = '';
  setTimeout(()=>{
    addMsg("GEMINI 2.1: " + getReply(text), 'ai');
  }, 300);
}

input.addEventListener('keypress', function(e){
  if(e.key === 'Enter') send();
});

// RECORDING BUTTON
function startVoice(){
  let Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Speech){
    alert("Voice not supported in this browser. Use Chrome.");
    return;
  }
  let rec = new Speech();
  rec.lang = 'en-US';
  rec.start();
  document.getElementById('mic').innerText = '🔴';
  rec.onresult = function(e){
    let spoken = e.results[0][0].transcript;
    input.value = spoken;
    document.getElementById('mic').innerText = '🎤';
    send();
  };
  rec.onerror = function(){
    document.getElementById('mic').innerText = '🎤';
  };
}
</script>
</body>
</html>
