<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMINI 2.1 - By Abul Rafae</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:20px}
h1{color:#00f0ff;text-shadow:0 0 10px #00f0ff}
.card{background:#111;border:1px solid #00f0ff;border-radius:12px;padding:15px;max-width:600px;margin:20px auto}
input{width:65%;padding:10px;border-radius:8px;border:none}
button{background:#00f0ff;color:#000;padding:10px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:5px}
#chat{text-align:left;margin-top:15px;white-space:pre-wrap;background:#222;padding:10px;border-radius:8px;min-height:100px}
</style>
</head>
<body>
<h1>GEMINI 2.1</h1>
<p>Owner: Abul Rafae | Model: gemini-1.5-flash ✅</p>
<div class="card">
<button id="changeKeyBtn">Change Key</button>
<span id="status">Ready</span>
</div>
<div class="card">
<input id="userInput" placeholder="Any language me likho...">
<button id="sendBtn">Send</button>
<div id="chat">Salam! Kuch poocho...</div>
</div>
<script>
let API_KEY = localStorage.getItem('gemini_api_key');
function askKey(){
  let k = prompt("Apni Gemini API Key paste karo:");
  if(k && k.trim() !== ""){
    localStorage.setItem('gemini_api_key', k.trim());
    API_KEY = k.trim();
    document.getElementById('status').innerText = "Key Saved ✅";
  }
}
document.addEventListener('DOMContentLoaded', () => {
  if(!API_KEY){ askKey(); }
  document.getElementById('changeKeyBtn').onclick = function(){
    localStorage.removeItem('gemini_api_key');
    askKey();
    location.reload();
  };
  document.getElementById('sendBtn').onclick = async function(){
    const input = document.getElementById('userInput').value;
    if(!input) return;
    if(!API_KEY){ askKey(); return; }
    const chat = document.getElementById('chat');
    chat.innerHTML += "\n\nYou: " + input;
    document.getElementById('userInput').value = "";
    chat.innerHTML += "\nGemini: soch raha hai...";
    try{
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({contents:[{parts:[{text:input}]}]})
      });
      const data = await res.json();
      if(data.error){ 
        chat.innerHTML = chat.innerHTML.replace("soch raha hai...", "Error: " + data.error.message); 
      } else {
        let text = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response";
        chat.innerHTML = chat.innerHTML.replace("soch raha hai...", text);
      }
    }catch(e){ chat.innerHTML += "\nError: " + e.message; }
  };
});
</script>
</body>
</html>
