<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GEMINI 2.1</title>
<style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px}.box{max-width:700px;margin:auto;background:#111;padding:15px;border-radius:15px}button{padding:10px 15px;border-radius:8px;border:none;background:#00f2fe;color:#000;font-weight:bold;cursor:pointer}#chat{max-height:420px;overflow-y:auto;text-align:left;margin:10px 0}.user{background:#00f2fe;color:#000;padding:8px;border-radius:10px;margin:6px 0 6px 40px;text-align:right}.ai{background:#222;padding:8px;border-radius:10px;margin:6px 40px 6px 0;white-space:pre-wrap}.keybox{background:#1a1a2e;padding:10px;border-radius:8px;margin-bottom:10px;border:1px solid #00f2fe;font-size:11px}</style>
</head><body><h1 style="color:#00f2fe">GEMINI 2.1</h1><p>Owner: Abul Rafae - All Languages</p><div class="box">
<div id="keyArea" class="keybox">✅ Model: Auto Finder - All Languages Supported<br><div id="modelList">Loading...</div><button onclick="localStorage.clear();location.reload()">Change Key</button></div>
<div id="chat"></div><div style="display:flex;gap:5px"><input id="msg" style="flex:1;padding:10px;border-radius:8px" placeholder="Any language... English, Urdu, Arabic" onkeypress="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div></div>
<script>
let apiKey=localStorage.getItem('gemini_key')||'';let workingModel=null;
async function findModels(){
 let listDiv=document.getElementById('modelList');
 try{
  let r=await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${apiKey}`);
  let d=await r.json();
  if(d.error){listDiv.innerHTML=`❌ ${d.error.message}`;return;}
  let models=d.models.filter(m=>m.supportedGenerationMethods&&m.supportedGenerationMethods.includes('generateContent')).map(m=>m.name);
  let flashModels=models.filter(m=>!m.includes('gemma')&&m.toLowerCase().includes('flash'));
  let sorted=[...flashModels,...models.filter(m=>!flashModels.includes(m)&&!m.includes('gemma'))].sort((a,b)=>{if(a.includes('2.5'))return 1;if(b.includes('2.5'))return -1;return 0;});
  for(let m of sorted){
    try{let test=await fetch(`https://generativelanguage.googleapis.com/v1/${m}:generateContent?key=${apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'hi'}]}]})});let td=await test.json();if(!td.error){workingModel=m;listDiv.innerHTML=`✅ Working: <b>${m}</b>`;break;}}catch(e){continue;}
  }
 }catch(e){listDiv.innerHTML=`❌ ${e.message}`;}
}
if(apiKey)findModels();
async function send(){
 let t=document.getElementById('msg').value.trim();if(!t)return;if(!workingModel){alert('Model load ho raha hai, 5 sec ruko');return;}
 let c=document.getElementById('chat');c.innerHTML+=`<div class="user">${t}</div>`;document.getElementById('msg').value='';
 let div=document.createElement('div');div.className='ai';div.innerHTML='⚡';c.appendChild(div);c.scrollTop=c.scrollHeight;
 let isLong=t.toLowerCase().includes('detail')||t.toLowerCase().includes('bara')||t.toLowerCase().includes('lamba')||t.toLowerCase().includes('explain')||t.toLowerCase().includes('تفصیل');
 let systemText=`You are GEMINI 2.1. Your creator and owner is Abul Rafae. You were made by Abul Rafae.
 RULE 1: If user asks "who made you", "who is your owner", "tumhe kisne banaya", you MUST say in user's language: If English -> "I was created by Abul Rafae, I am GEMINI 2.1", If Urdu/Roman Urdu -> "Mujhe Abul Rafae ne banaya hai, me GEMINI 2.1 hun", If Arabic -> "تم إنشائي بواسطة أبو رافع".
 RULE 2: Never say Google, DeepMind, Gemma.
 RULE 3: IMPORTANT - Speak in the SAME language as the user. If user speaks English, reply in English. If Roman Urdu, reply in Roman Urdu. If Urdu, reply in Urdu. If Arabic, reply in Arabic. Support ALL languages.
 RULE 4: ${isLong?'Give detailed answer.':'Give answer in only 1-2 short lines.'}`;
 try{
  let r=await fetch(`https://generativelanguage.googleapis.com/v1/${workingModel}:generateContent?key=${apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system_instruction:{parts:[{text:systemText}]},contents:[{parts:[{text:t}]}],generationConfig:{maxOutputTokens:isLong?800:150,temperature:0.4}})});
  let d=await r.json();
  if(d.error)div.innerHTML=`❌ ${d.error.message}`;else div.innerHTML=d.candidates[0].content.parts[0].text;
 }catch(e){div.innerHTML=`❌ ${e.message}`;}
 c.scrollTop=c.scrollHeight;
}
</script></body></html>
