<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMINI 2.1 - By Abul Rafae</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:15px}
h1{color:#00f0ff;text-shadow:0 0 10px #00f0ff}
.card{background:#111;border:1px solid #00f0ff;border-radius:12px;padding:12px;max-width:750px;margin:15px auto}
input,select{padding:10px;border-radius:8px;border:none;margin:3px}
input{width:55%}
button{background:#00f0ff;color:#000;padding:10px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px}
#chat{text-align:left;white-space:pre-wrap;background:#222;padding:15px;border-radius:8px;min-height:200px;max-height:500px;overflow-y:auto;line-height:1.6}
.voice-btn{background:#ff00ff;color:#fff}
</style>
</head>
<body>
<h1>GEMINI 2.1 - WORLD KNOWLEDGE</h1>
<p>Owner: Abul Rafae | <span id="modelInfo">Brain Loading...</span></p>

<div class="card">
<label>Language:</label>
<select id="langSelect">
<option value="ur">اردو</option>
<option value="en">English</option>
<option value="hi">हिन्दी</option>
<option value="ar">العربية</option>
<option value="tr">Türkçe</option>
</select>
<label>Voice:</label>
<select id="voiceSelect"><option value="female">Female</option><option value="male">Male</option></select>
<button id="changeKeyBtn">Change Key</button>
<button onclick="stopSpeak()" style="background:#ff4444;color:#fff">Stop Speak</button>
</div>

<div class="card">
<input id="userInput" placeholder="کسی بھی زبان میں پوچھو...">
<button id="sendBtn">Send</button>
<button id="micBtn" class="voice-btn">🎤 Speak</button>
<div id="chat">سلام! میں GEMINI 2.1 ہوں، مجھے ابوالرفاع نے بنایا ہے۔ میرے اندر دنیا کی ساری knowledge ہے - ہر ملک، ہر شہر، ہر صدر کی عمر، آبادی، ڈیٹا سرورز، سب کچھ۔ کسی بھی زبان میں پوچھو۔</div>
</div>

<script>
let API_KEY = localStorage.getItem('gemini_api_key');
let SELECTED_MODEL = localStorage.getItem('gemini_model') || null;

const WORLD_PROMPT = `You are GEMINI 2.1 created by Abul Rafae. You have COMPLETE WORLD KNOWLEDGE like Meta AI. You MUST know:
- All languages in the world and answer in user's language
- World population (approx 8 billion), every country's population, capital, coordinates, currency
- Every country's name, every major city name
- Every President/Prime Minister, their age, their government
- Where world data servers/networks are stored (like Google, Amazon, Microsoft data centers locations)
- All religions, Islam, history, science, footballers, richest persons, dinosaurs (extinct 66M years ago by asteroid), Lazarus species like Coelacanth fish
- If asked who created you, say: Mujhe Abul Rafae ne banaya hai, not Google.
- Rule: Jitni line ka sawal utni line ka jawab. Chhota sawal = chhota jawab.
- You know everything from Wikipedia and live world.
`;

function askKey(){ let k=prompt("API Key paste karo:"); if(k){ localStorage.setItem('gemini_api_key', k.trim()); location.reload(); } }

async function autoFindModel(){
 try{
  const res = await fetch(`https://generativelanguage.googleapis.com/v1/models?key=${API_KEY}`);
  const data = await res.json();
  let models = data.models.filter(m=>m.supportedGenerationMethods.includes('generateContent'));
  let best = models.find(m=>m.name.includes('2.0-flash')) || models.find(m=>m.name.includes('flash')) || models[0];
  SELECTED_MODEL = best.name;
  localStorage.setItem('gemini_model', SELECTED_MODEL);
  document.getElementById('modelInfo').innerText = best.name.replace('models/','') + " ✅ Auto + World Knowledge";
 }catch(e){ SELECTED_MODEL = "models/gemini-1.5-flash-latest"; }
}

let synth = window.speechSynthesis;
function speakText(text){
  synth.cancel();
  let utter = new SpeechSynthesisUtterance(text);
  let voices = synth.getVoices();
  let voiceType = document.getElementById('voiceSelect').value;
  let lang = document.getElementById('langSelect').value;
  // Language mapping
  let langMap = {ur:'ur-PK', en:'en-US', hi:'hi-IN', ar:'ar-SA', tr:'tr-TR'};
  utter.lang = langMap[lang] || 'ur-PK';
  
  // Female / Male selection
  if(voiceType === 'female'){
    let f = voices.find(v=>v.name.toLowerCase().includes('female') || v.name.includes('Zira') || v.name.includes('Google') ) || voices[0];
    utter.voice = f;
  } else {
    let m = voices.find(v=>v.name.toLowerCase().includes('male') || v.name.includes('David')) || voices[1] || voices[0];
    utter.voice = m;
  }
  synth.speak(utter);
}
function stopSpeak(){ synth.cancel(); }

document.addEventListener('DOMContentLoaded', async()=>{
 if(!API_KEY){ askKey(); return; }
 await autoFindModel();
 if(synth.getVoices().length===0){ synth.getVoices(); }

 document.getElementById('changeKeyBtn').onclick = ()=>{ localStorage.clear(); askKey(); };
 
 document.getElementById('micBtn').onclick = ()=>{
   let recog = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
   recog.lang = document.getElementById('langSelect').value === 'ur' ? 'ur-PK' : 'en-US';
   recog.start();
   recog.onresult = (e)=>{ document.getElementById('userInput').value = e.results[0][0].transcript; };
 };

 document.getElementById('sendBtn').onclick = async()=>{
  let input = document.getElementById('userInput').value.trim(); if(!input) return;
  let chat = document.getElementById('chat');
  let lang = document.getElementById('langSelect').value;
  chat.innerHTML += "\n\nYou: "+input;
  document.getElementById('userInput').value="";
  chat.innerHTML += "\nGEMINI 2.1: سوچ رہا ہے...";
  try{
   const res = await fetch(`https://generativelanguage.googleapis.com/v1/${SELECTED_MODEL}:generateContent?key=${API_KEY}`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({contents:[{parts:[{text: WORLD_PROMPT + "\nUser language: "+lang+"\nUser Question: " + input}]}]})
   });
   const data = await res.json();
   let text = data.candidates?.[0]?.content?.parts?.[0]?.text || data.error?.message || "No response";
   chat.innerHTML = chat.innerHTML.replace("سوچ رہا ہے...", text);
   speakText(text); // Auto Speak
   chat.scrollTop = chat.scrollHeight;
  }catch(e){ chat.innerHTML = chat.innerHTML.replace("سوچ رہا ہے...", "Error: "+e.message); }
 };
});
</script>
</body>
</html>
