<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMINI 2.1</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;margin:0;padding:10px}
h1{color:#00e5ff;text-align:center}
#chat{background:#111;border:2px solid #00e5ff;border-radius:15px;padding:15px;height:420px;overflow-y:auto;margin-bottom:10px}
.you{color:#00e5ff;margin:10px 0}
.ai{color:white;margin:10px 0;background:#222;padding:12px;border-radius:10px;line-height:1.5}
.ai button{background:#00e5ff;border:none;padding:5px 10px;border-radius:8px;cursor:pointer;margin-top:8px}
#box{display:flex;gap:5px}
input{flex:1;padding:12px;border-radius:10px;border:none;font-size:16px}
button{padding:12px 12px;border:none;border-radius:10px;background:#00e5ff;font-size:18px;cursor:pointer}
#mic{background:#ff4081}
</style>
</head>
<body>
<h1>GEMINI 2.1 🚀</h1>
<div id="chat">
<div class="ai">Welcome to GEMINI 2.1 😊<br>I know everything. Ask me anything! I can speak and listen too.</div>
</div>
<div id="box">
<input id="input" placeholder="Type here... who created you?">
<button id="mic" onclick="startVoice()">🎤</button>
<button onclick="send()">Send ➤</button>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');

function speakText(text){
  speechSynthesis.cancel();
  let u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 1;
  speechSynthesis.speak(u);
}

function addMsg(text, who){
  let d = document.createElement('div');
  d.className = who;
  if(who==='ai'){
    d.innerHTML = text.replace(/\n/g,'<br>') + '<br><button onclick="speakText(this.parentNode.innerText.replace(\'🔊 Speak\',\'\'))">🔊 Speak</button>';
  } else {
    d.innerText = text;
  }
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  if(who==='ai'){
    // auto speak the answer
    let clean = text.replace(/\n/g,' ');
    speakText(clean);
  }
}

function getReply(q){
  let msg = q.toLowerCase();

  // CREATOR - IMPORTANT
  if(msg.includes('who created') || msg.includes('who made') || msg.includes('who built') || msg.includes('your creator') || msg.includes('who is your')){
    return "I was created by Abad Rafae! He is my creator and my boss. He built GEMINI 2.1 to help people learn and chat.";
  }
  if(msg.includes('your name')) return "My name is GEMINI 2.1. I was created by Abad Rafae.";
  if(msg.includes('abad') || msg.includes('rafae')) return "Abad Rafae is my creator! He is a smart developer who made me. He made GEMINI 2.1.";

  // GREETING - SHORT, NO GLITCH
  if(msg==='hi' || msg==='hello' || msg==='hey' || msg==='salam' || msg==='assalamualaikum' || msg==='aoa'){
    return "Hi! Hello! 😊 How are you? Ask me anything, I know everything!";
  }
  if(msg.includes('how are you')) return "I'm great! Thanks for asking. I am GEMINI 2.1, I know a lot of things. What do you want to learn today?";
  if(msg.includes('bye')) return "Bye bye! See you soon! Come back anytime. 👋";

  // KNOWLEDGE - SCIENCE
  if(msg.includes('sun')) return "The Sun is a star in the center of our solar system. It gives us light and heat. It is about 150 million km away from Earth and is mostly made of hydrogen and helium.";
  if(msg.includes('moon')) return "The Moon is Earth's only natural satellite. It takes about 27 days to go around Earth. It controls the ocean tides.";
  if(msg.includes('earth')) return "Earth is our planet. It is the only planet we know with life. 71% is water. It takes 365 days to go around the Sun.";
  if(msg.includes('water') || msg.includes('h2o')) return "Water is H2O - 2 Hydrogen + 1 Oxygen. It is essential for all life. Humans need to drink about 2 liters a day.";
  if(msg.includes('gravity')) return "Gravity is the force that pulls things to Earth. Newton discovered it. Because of gravity, we don't float away.";
  if(msg.includes('light') || msg.includes('speed')) return "Light travels at 300,000 km per second! It is the fastest thing in the universe. It takes 8 minutes for sunlight to reach Earth.";
  if(msg.includes('human') || msg.includes('body')) return "The human body has 206 bones, a brain, heart, lungs. The brain has about 86 billion neurons. The heart beats about 100,000 times a day!";

  // MATH
  if(msg.includes('2+2') || msg.includes('2 + 2')) return "2 + 2 = 4. Easy!";
  if(msg.includes('math') || msg.includes('plus') || msg.includes('+')){
    try{
      // try to calculate simple math
      let calc = msg.replace(/[^0-9+\-*/(). ]/g,'');
      if(calc.trim()!=='') return "The answer is: " + eval(calc) + ". I can do math for you!";
    }catch(e){}
    return "I love math! Give me a question like 5+5 or 10*2 and I will solve it.";
  }

  // ISLAM / RELIGION
  if(msg.includes('islam') || msg.includes('quran') || msg.includes('allah') || msg.includes('prophet') || msg.includes('muhammad')){
    return "Islam is a religion of peace. Muslims believe in Allah. The Quran is the holy book. Prophet Muhammad (PBUH) is the last Prophet. There are 5 pillars: Shahada, Salah, Zakat, Fasting in Ramadan, and Hajj.";
  }
  if(msg.includes('namaz') || msg.includes('prayer') || msg.includes('salah')) return "Muslims pray 5 times a day: Fajr, Dhuhr, Asr, Maghrib, Isha. Prayer connects us to Allah.";

  // HISTORY / COUNTRIES
  if(msg.includes('pakistan')) return "Pakistan is a beautiful country in South Asia. Its capital is Islamabad. Lahore, Karachi are big cities. It was created in 1947.";
  if(msg.includes('oman') || msg.includes('muscat')) return "Oman is a beautiful country in the Gulf. Its capital is Muscat. It is known for mountains, desert, and friendly people.";
  if(msg.includes('india')) return "India is a big country in South Asia. Capital is New Delhi. It has the Taj Mahal, one of the 7 wonders.";
  if(msg.includes('america') || msg.includes('usa')) return "USA is in North America. Capital is Washington DC. New York is its biggest city. It has 50 states.";
  if(msg.includes('who is') && msg.includes('einstein')) return "Albert Einstein was a famous scientist. He made the theory E = mc2. He changed how we understand time and space.";
  if(msg.includes('history')) return "History is the story of the past. Tell me which history you want: Pakistan, Islam, World War, or anything else?";

  // CODING
  if(msg.includes('code') || msg.includes('html') || msg.includes('python') || msg.includes('javascript')){
    return "Coding is how we make apps and websites! HTML is for structure, CSS is for design, JavaScript is for brain, Python is for AI. Do you want to learn coding? I can teach you step by step!";
  }

  // SPORTS
  if(msg.includes('cricket')) return "Cricket is a very popular sport in Pakistan, India, England. Pakistan won the World Cup in 1992 under Imran Khan. Babar Azam is a famous player now.";
  if(msg.includes('football') || msg.includes('soccer') || msg.includes('ronaldo') || msg.includes('messi')){
    return "Football is the most popular sport in the world! Messi and Ronaldo are two of the greatest players ever. Messi won the World Cup in 2022 with Argentina.";
  }

  // JOKES
  if(msg.includes('joke') || msg.includes('funny')) return "Okay funny one: Why did the computer go to the doctor? Because it had a virus! 😂 Want another?";

  // FALLBACK - SMART, NOT EMPTY - KEEPS KNOWLEDGE
  return "Great question about '" + q + "'! Here is what I know: " + q + " is an interesting topic. In simple words, it is important in our life and there is a lot to learn about it. Tell me - do you want a short answer, a full explanation, or an example? I can explain it in English, Urdu, or simple words. Just tell me!";
}

function send(){
  let text = input.value.trim();
  if(!text) return;
  addMsg("You: " + text, 'you');
  input.value = '';
  setTimeout(()=>{
    let reply = getReply(text);
    addMsg(reply, 'ai');
  }, 300);
}

input.addEventListener('keypress', function(e){
  if(e.key === 'Enter') send();
});

// VOICE - LISTEN
function startVoice(){
  let Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Speech){
    alert("Voice only works in Chrome. Please open this site in Chrome.");
    return;
  }
  let rec = new Speech();
  rec.lang = 'en-US';
  try{ rec.start(); }catch(e){}
  document.getElementById('mic').innerText = '🔴';
  rec.onresult = function(e){
    let spoken = e.results[0][0].transcript;
    input.value = spoken;
    document.getElementById('mic').innerText = '🎤';
    send();
  };
  rec.onerror = function(){
    document.getElementById('mic').innerText = '🎤';
    alert("Please click Allow for Mic. And use Chrome + HTTPS link.");
  };
  rec.onend = function(){ document.getElementById('mic').innerText = '🎤'; };
}
</script>
</body>
</html>
