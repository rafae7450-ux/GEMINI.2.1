<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEMINI 2.1 - By Abul Rafae</title>
<style>
body{margin:0;font-family:Arial;background:#0a0a0a;color:white;text-align:center}
.logo{width:180px;margin-top:40px;border-radius:25px;box-shadow:0 0 30px #00ffff,0 0 60px #ff00ff}
h1{font-size:45px;background:linear-gradient(90deg,#00ffff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:20px 0 10px}
p{color:#aaa;font-size:18px}
.btn{display:inline-block;margin:30px;padding:16px 35px;background:linear-gradient(90deg,#00ffff,#ff00ff);color:white;text-decoration:none;border-radius:30px;font-weight:bold;font-size:18px;box-shadow:0 5px 20px rgba(0,255,255,0.3);cursor:pointer;border:none}
#chatBox{display:none;max-width:600px;margin:20px auto;background:#111;border-radius:15px;padding:20px;text-align:left}
#messages{height:300px;overflow-y:auto;background:#000;border-radius:10px;padding:15px;margin-bottom:15px}
.msg{margin:10px 0;padding:10px 15px;border-radius:10px}
.user{background:#00ffff22;text-align:right}
.ai{background:#ff00ff22}
input{width:75%;padding:12px;border-radius:20px;border:none;background:#222;color:white}
button.send{width:20%;padding:12px;border-radius:20px;border:none;background:linear-gradient(90deg,#00ffff,#ff00ff);color:white;font-weight:bold;margin-left:5px;cursor:pointer}
</style>
</head>
<body>
<div id="landing">
<img src="logo.jpg" class="logo">
<h1>GEMINI 2.1</h1>
<p>By Abul Rafae - Next Generation AI Experience</p>
<button class="btn" onclick="launch()">🚀 Launch GEMINI</button>
<p style="font-size:14px;margin-top:50px;">© 2026 GEMINI 2.1</p>
</div>

<div id="chatBox">
<h2 style="text-align:center">💬 GEMINI 2.1 Chat</h2>
<div id="messages"><div class="msg ai">Hello! I'm GEMINI 2.1 by Abul Rafae. How can I help you today? 🚀</div></div>
<div style="display:flex"><input id="input" placeholder="Type your message..." onkeypress="if(event.key==='Enter')send()"><button class="send" onclick="send()">Send</button></div>
<br><button class="btn" style="padding:8px 20px;font-size:14px" onclick="back()">← Back</button>
</div>

<script>
function launch(){document.getElementById('landing').style.display='none';document.getElementById('chatBox').style.display='block';}
function back(){document.getElementById('chatBox').style.display='none';document.getElementById('landing').style.display='block';}
function send(){
let input=document.getElementById('input');let msg=input.value.trim();if(!msg)return;
let messages=document.getElementById('messages');
messages.innerHTML+=`<div class="msg user">${msg}</div>`;
input.value='';
setTimeout(()=>{messages.innerHTML+=`<div class="msg ai">🤖 GEMINI 2.1 Response: You said "${msg}". This is a demo by Abul Rafae! Real AI API coming soon! 🔥</div>`;messages.scrollTop=messages.scrollHeight;},800);
messages.scrollTop=messages.scrollHeight;
}
</script>
</body>
</html>
